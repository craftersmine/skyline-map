name: Feature idea
description: Suggest something new or a change to how something works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do in your city, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Mock-ups and examples from other map apps are welcome.
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
