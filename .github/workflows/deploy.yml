name: Deploy

# Deploys main to https://skyline.codz.me (Cloudflare Workers static assets, see wrangler.jsonc).
# The job uses the "production" environment, which waits for a maintainer's approval before it runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.repository == 'hjun1052/skyline-map'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://skyline.codz.me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Self-checks
        run: npm run check && npm run check:i18n
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.40.3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm the live site serves this build
        run: |
          want=$(basename dist/assets/main-*.js)
          for i in $(seq 1 18); do
            got=$(curl -fsS https://skyline.codz.me/ | grep -oE 'main-[A-Za-z0-9_-]+\.js' | head -1 || true)
            if [ "$got" = "$want" ] && curl -fsS "https://skyline.codz.me/assets/$want" | cmp -s - "dist/assets/$want"; then
              echo "Live site serves $want"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live site still serves ${got:-nothing} instead of $want"
          exit 1
